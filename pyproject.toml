[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-agent"
version = "0.1.0"
description = "Evidence-driven local code review agent foundation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
eval-public = ["pyarrow>=14.0"]

[project.scripts]
review-agent = "review_agent.cli:main"
review-agent-eval = "review_agent_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"review_agent.developer_rules" = ["system_rules.json", "rule_docs/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
